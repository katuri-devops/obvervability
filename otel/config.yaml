receivers:
 otlp:
   protocols:
     grpc:
       endpoint: 0.0.0.0:4317
     http:
       endpoint: 0.0.0.0:4318
 
processors:
 memory_limiter:
   check_interval: 2s
   limit_mib: 400
 batch:
 resourcedetection:
   detectors: [system]
   override: true
 resource/env:
   attributes:
     - key: deployment.environment
       value: claims-lab
       action: upsert
 
exporters:
 debug:
   verbosity: detailed
 
service:
 pipelines:
   traces:
     receivers: [otlp]
     processors: [memory_limiter, batch, resourcedetection, resource/env]
     exporters: [debug]