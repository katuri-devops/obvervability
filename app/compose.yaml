# The app setup. First version: only the load balancer.
# The services are added to this file in the next steps.
name: claims-app

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      # Find containers through Docker, but only the ones that ask for it with a label.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=claims-net
      # "web" is the door for browsers. "internal" is for calls between services.
      - --entrypoints.web.address=:80
      - --entrypoints.internal.address=:8000
      # Dashboard without a password. Acceptable for a training system only.
      - --api.insecure=true
      - --ping=true
      - --accesslog=true
    ports:
      # Reachable from your own computer only.
      - "127.0.0.1:8080:80"      # the claims web pages
      - "127.0.0.1:8088:8080"    # the Traefik dashboard
    volumes:
      # Lets Traefik ask Docker which containers are running.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - claims-net

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: customer-service
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=customer-service
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.customer-service.rule=PathPrefix(`/customer-service`)
      - traefik.http.routers.customer-service.entrypoints=web,internal
      - traefik.http.routers.customer-service.middlewares=customer-service-strip
      - traefik.http.middlewares.customer-service-strip.stripprefix.prefixes=/customer-service
      - traefik.http.services.customer-service.loadbalancer.server.port=8000
      - traefik.http.services.customer-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.customer-service.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  policy-service:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: policy-service
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=policy-service
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.policy-service.rule=PathPrefix(`/policy-service`)
      - traefik.http.routers.policy-service.entrypoints=web,internal
      - traefik.http.routers.policy-service.middlewares=policy-service-strip
      - traefik.http.middlewares.policy-service-strip.stripprefix.prefixes=/policy-service
      - traefik.http.services.policy-service.loadbalancer.server.port=8000
      - traefik.http.services.policy-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.policy-service.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=payment-service
      BANK_URL: http://bank-api:8000
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.payment-service.rule=PathPrefix(`/payment-service`)
      - traefik.http.routers.payment-service.entrypoints=web,internal
      - traefik.http.routers.payment-service.middlewares=payment-service-strip
      - traefik.http.middlewares.payment-service-strip.stripprefix.prefixes=/payment-service
      - traefik.http.services.payment-service.loadbalancer.server.port=8000
      - traefik.http.services.payment-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.payment-service.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  claims-api:
    build:
      context: .
      dockerfile: claims-api/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: claims-api
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=claims-api
      CUSTOMER_SERVICE_URL: http://traefik:8000/customer-service
      POLICY_SERVICE_URL: http://traefik:8000/policy-service
      PAYMENT_SERVICE_URL: http://traefik:8000/payment-service
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.claims-api.rule=PathPrefix(`/claims-api`)
      - traefik.http.routers.claims-api.entrypoints=web,internal
      - traefik.http.routers.claims-api.middlewares=claims-api-strip
      - traefik.http.middlewares.claims-api-strip.stripprefix.prefixes=/claims-api
      - traefik.http.services.claims-api.loadbalancer.server.port=8000
      - traefik.http.services.claims-api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.claims-api.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  # The bank, given ready-made. It plays an outside provider: one copy,
  # called directly at http://bank-api:8000, not through Traefik.
  bank-api:
    build:
      context: .
      dockerfile: bank-api/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: bank-api
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - claims-net
 

networks:
  # Created once by hand and shared by all four setups.
  claims-net:
    external: true
 