name: claims-app
x-otel-env: &otel-env
 OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
 OTEL_EXPORTER_OTLP_PROTOCOL: grpc
 OTEL_RESOURCE_ATTRIBUTES: deployment.environment=claims-lab,service.version=1.0.0
 OTEL_PYTHON_EXCLUDED_URLS: health
 OTEL_PYTHON_LOG_CORRELATION: "true"
 OTEL_LOGS_EXPORTER: none

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=claims-net
      - --entrypoints.web.address=:80
      - --entrypoints.internal.address=:8000
      - --api.insecure=true
      - --ping=true
      - --accesslog=true
      - --tracing.serviceName=traefik
      - --tracing.sampleRate=1.0
      - --tracing.otlp.grpc=true
      - --tracing.otlp.grpc.endpoint=otel-collector:4317
      - --tracing.otlp.grpc.insecure=true
    ports:
      - "0.0.0.0:8080:80"
      - "127.0.0.1:8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - claims-net

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: customer-service
      OTEL_SERVICE_NAME: customer-service
      <<: *otel-env
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=customer-service
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.customer-service.rule=PathPrefix(`/customer-service`)
      - traefik.http.routers.customer-service.entrypoints=web,internal
      - traefik.http.routers.customer-service.middlewares=customer-service-strip
      - traefik.http.middlewares.customer-service-strip.stripprefix.prefixes=/customer-service
      - traefik.http.services.customer-service.loadbalancer.server.port=8000
      - traefik.http.services.customer-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.customer-service.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  policy-service:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: policy-service
      OTEL_SERVICE_NAME: policy-service
      <<: *otel-env
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=policy-service
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.policy-service.rule=PathPrefix(`/policy-service`)
      - traefik.http.routers.policy-service.entrypoints=web,internal
      - traefik.http.routers.policy-service.middlewares=policy-service-strip
      - traefik.http.middlewares.policy-service-strip.stripprefix.prefixes=/policy-service
      - traefik.http.services.policy-service.loadbalancer.server.port=8000
      - traefik.http.services.policy-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.policy-service.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: payment-service
      OTEL_SERVICE_NAME: payment-service
      <<: *otel-env
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=payment-service
      BANK_URL: http://bank-api:8000
      REDIS_URL: redis://redis:6379/0
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.payment-service.rule=PathPrefix(`/payment-service`)
      - traefik.http.routers.payment-service.entrypoints=web,internal
      - traefik.http.routers.payment-service.middlewares=payment-service-strip
      - traefik.http.middlewares.payment-service-strip.stripprefix.prefixes=/payment-service
      - traefik.http.services.payment-service.loadbalancer.server.port=8000
      - traefik.http.services.payment-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.payment-service.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  claims-api:
    build:
      context: .
      dockerfile: claims-api/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: claims-api
      OTEL_SERVICE_NAME: claims-api
      <<: *otel-env
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=claims-api
      CUSTOMER_SERVICE_URL: http://traefik:8000/customer-service
      POLICY_SERVICE_URL: http://traefik:8000/policy-service
      PAYMENT_SERVICE_URL: http://traefik:8000/payment-service
      RABBITMQ_URL: amqp://claims:claims-dev-password@rabbitmq:5672/%2F
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.claims-api.rule=PathPrefix(`/claims-api`)
      - traefik.http.routers.claims-api.entrypoints=web,internal
      - traefik.http.routers.claims-api.middlewares=claims-api-strip
      - traefik.http.middlewares.claims-api-strip.stripprefix.prefixes=/claims-api
      - traefik.http.services.claims-api.loadbalancer.server.port=8000
      - traefik.http.services.claims-api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.claims-api.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: notification-service
      OTEL_SERVICE_NAME: notification-service
      <<: *otel-env
      DATABASE_URL: postgresql+psycopg://claims:claims-dev-password@postgres:5432/claims?application_name=notification-service
      RABBITMQ_URL: amqp://claims:claims-dev-password@rabbitmq:5672/%2F
      CUSTOMER_SERVICE_URL: http://traefik:8000/customer-service
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.notification-service.rule=PathPrefix(`/notification-service`)
      - traefik.http.routers.notification-service.entrypoints=web,internal
      - traefik.http.routers.notification-service.middlewares=notification-service-strip
      - traefik.http.middlewares.notification-service-strip.stripprefix.prefixes=/notification-service
      - traefik.http.services.notification-service.loadbalancer.server.port=8000
      - traefik.http.services.notification-service.loadbalancer.healthcheck.path=/health
      - traefik.http.services.notification-service.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

  bank-api:
    build:
      context: .
      dockerfile: bank-api/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: bank-api
      OTEL_SERVICE_NAME: bank-api
      <<: *otel-env
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - claims-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: frontend
      OTEL_SERVICE_NAME: frontend
      <<: *otel-env
      CLAIMS_API_URL: http://traefik:8000/claims-api
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.services.frontend.loadbalancer.server.port=8000
      - traefik.http.services.frontend.loadbalancer.healthcheck.path=/health
      - traefik.http.services.frontend.loadbalancer.healthcheck.interval=5s
    networks:
      - claims-net

networks:
  claims-net:
    external: true
