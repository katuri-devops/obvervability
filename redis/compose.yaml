# Redis: the cache of the claims system.
name: claims-redis



services:
  redis:
   image: redis:8
   restart: unless-stopped
   # A cache only: nothing is saved to disk, and old entries are dropped at 64 MB.
   command:
     - redis-server
     - --save
     - ""
     - --appendonly
     - "no"
     - --maxmemory
     - 64mb
     - --maxmemory-policy
     - allkeys-lru
   ports:
     # Reachable from your own computer only, on port 16379.
     - "127.0.0.1:16379:6379"
   healthcheck:
     test: ["CMD", "redis-cli", "ping"]
     interval: 5s
     timeout: 3s
     retries: 12
   networks:
     - claims-net



networks:
  # Created once by hand and shared by all four setups.
  claims-net:
   external: true
 