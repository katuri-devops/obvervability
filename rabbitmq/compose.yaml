# RabbitMQ: the message queue of the claims system.
name: claims-rabbitmq

services:
  rabbitmq:
    image: rabbitmq:4-management
    # RabbitMQ names its data folder after the host name, so the name must stay the same.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: claims
      RABBITMQ_DEFAULT_PASS: claims-dev-password
    ports:
      # Reachable from your own computer only.
      - "127.0.0.1:5672:5672"      # messages
      - "127.0.0.1:15672:15672"    # web console
    volumes:
      # Keeps the queues and messages when the container is removed.
      - data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - claims-net

volumes:
  data:

networks:
  # Created once by hand and shared by all four setups.
  claims-net:
    external: true
 